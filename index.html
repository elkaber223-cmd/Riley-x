<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RILEY-X | SMART VIP Hub</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #000; color: #fff; transition: 0.3s; }
  
  /* SMART NAV */
  nav {
    background: #0a0a0a; display: flex; justify-content: space-between; 
    align-items: center; padding: 15px 30px; border-bottom: 2px solid #00ff88;
    position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px);
  }
  nav .logo { font-size: 24px; font-weight: bold; color: #00ff88; text-shadow: 0 0 15px #00ff88; }
  nav .links a { color: #fff; text-decoration: none; margin-left: 20px; transition: 0.3s; }
  nav .links a:hover { color: #00ff88; text-shadow: 0 0 8px #00ff88; }
  .theme-btn { background: #00ff88; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  
  /* HERO */
  .hero { background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://i.imgur.com/XXXXXXX.jpg') center/cover; padding: 120px 20px; text-align: center; }
  .hero h1 { font-size: 48px; color: #00ff88; text-shadow: 0 0 25px #00ff88; animation: flicker 2s infinite; }
  @keyframes flicker { 0%,100%{opacity:1} 50%{opacity:0.7} }
  .visitor-count { margin-top: 10px; color: #00ccff; font-size: 14px; }
  
  .btn { display: inline-block; padding: 14px 24px; margin: 8px; border-radius: 10px; font-weight: bold; text-decoration: none; transition: 0.3s; }
  .btn-green { background: #00ff88; color: #000; box-shadow: 0 0 20px #00ff88; }
  .btn-blue { background: #0088ff; color: #fff; box-shadow: 0 0 20px #0088ff; }
  .btn:hover { transform: translateY(-4px) scale(1.05); }
  
  /* PRODUCTS */
  .products { padding: 60px 20px; text-align: center; }
  .products h2 { font-size: 32px; color: #00ff88; margin-bottom: 30px; text-shadow: 0 0 10px #00ff88; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1100px; margin: auto; }
  .card {
    background: #111; border: 1px solid #00ff88; border-radius: 15px; padding: 25px; 
    box-shadow: 0 0 25px rgba(0,255,136,0.15); transition: 0.4s; position: relative; overflow: hidden;
  }
  .card:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(0,255,136,0.4); }
  .vip-badge { position: absolute; top: 10px; right: 10px; background: #ff0044; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .price { font-size: 28px; color: #00ccff; font-weight: bold; margin: 12px 0; text-shadow:0 0 10px #00ccff; }
  .copy-btn { background: #222; color: #00ff88; border: 1px solid #00ff88; padding: 6px 10px; border-radius: 6px; cursor: pointer; margin-top: 10px; transition:0.3s; }
  .copy-btn:hover { background:#00ff88; color:#000; }
  
  /* FLOATING DM */
  .floating-dm {
    position: fixed; bottom: 25px; right: 25px; background: linear-gradient(90deg, #00ff88, #00ccff);
    color: #000; padding: 16px 22px; border-radius: 50px; font-weight: bold; text-decoration: none;
    box-shadow: 0 0 20px #00ff88, 0 0 40px #00ccff; animation: glow 1.5s ease-in-out infinite alternate; z-index: 9999;
  }
  @keyframes glow { from { box-shadow: 0 0 15px #00ff88 } to { box-shadow: 0 0 35px #00ccff } }
  
  /* SMART POPUP */
  .popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
    background: #111; border: 2px solid #00ff88; padding: 30px; border-radius: 15px; z-index: 10000; box-shadow: 0 0 50px #00ff88; }
  .popup .close { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 20px; color:#ff0044; }
  
  footer { background:#0a0a0a; padding:20px; text-align:center; color:#555; border-top:1px solid #222; margin-top:40px; }
</style>
</head>
